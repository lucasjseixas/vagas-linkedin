name: Alerta de vagas

on:
  schedule:
    # Horários em UTC: 11h e 21h UTC = 8h e 18h em Brasília
    - cron: "0 11 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write # para salvar o seen.json

concurrency:
  group: vagas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: pytest -q

      - name: Buscar e enviar vagas
        env:
          _SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          _GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Salvar vagas já vistas
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "chore: atualiza vagas vistas"
          git push
